name: Publicar

# A cada push na main, gera o EstrategiaDiagnostico.exe e o instalador EstrategiaDiagnostico-Setup.exe
# e atualiza a release "latest" (sempre a versão mais nova). Ao criar uma tag (ex.: v0.17.0), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = ([xml](Get-Content ResetExplode.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DDistDir=$pwd\dist" "/DAppVersion=$ver" installer\EstrategiaDiagnostico.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/EstrategiaDiagnostico.exe, dist/LEIA-ME.txt, dist/LICENSE.txt -DestinationPath EstrategiaDiagnostico.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release delete latest --cleanup-tag --yes
          gh release create latest dist/EstrategiaDiagnostico-Setup.exe EstrategiaDiagnostico.zip dist/EstrategiaDiagnostico.exe --target $env:GITHUB_SHA --latest --title "ESTRATÉGIA DIAGNÓSTICO (versão mais recente)" --notes-file NOVIDADES.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/EstrategiaDiagnostico-Setup.exe EstrategiaDiagnostico.zip dist/EstrategiaDiagnostico.exe --title "ESTRATÉGIA DIAGNÓSTICO $env:GITHUB_REF_NAME" --generate-notes --latest=false
